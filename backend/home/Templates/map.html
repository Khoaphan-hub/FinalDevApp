{% extends 'base.html' %}
{% load static %}

{% block title %}Bản đồ & Thời tiết - Journify{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<style>
    #map-wrapper {
        position: relative;
        height: 85vh;
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    #map { height: 100%; width: 100%; z-index: 1; }
    .leaflet-routing-container { display: none !important; }

    /* SEARCH PANEL (Giữ nguyên) */
    .search-panel {
        position: absolute; top: 20px; left: 20px; z-index: 1000;
        width: 320px; background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        padding: 20px; border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .input-group { margin-bottom: 12px; position: relative; }
    .input-group i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280; }
    .search-input { width: 100%; padding: 12px 12px 12px 35px; border: 1px solid #e5e7eb; border-radius: 8px; outline: none; }
    .btn-primary-custom { width: 100%; padding: 12px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }

    /* --- THIẾT KẾ MỚI CHO WEATHER WIDGET --- */
    #weather-widget {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        width: 260px; /* Cố định chiều rộng */
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 16px;
        padding: 15px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        display: none; /* JS sẽ bật lên */
        opacity: 0;
        transition: opacity 0.5s ease;
        max-height: 80vh; /* Giới hạn chiều cao */
        overflow-y: auto; /* Cho phép cuộn nếu danh sách dài */
        scrollbar-width: thin; /* Firefox scrollbar nhỏ */
    }

    /* Tiêu đề widget */
    #weather-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: #4b5563;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid rgba(0,0,0,0.1);
        padding-bottom: 8px;
    }

    /* Từng thẻ thời tiết nhỏ (trong danh sách) */
    .weather-item {
        display: flex;
        align-items: center;
        padding: 10px;
        margin-bottom: 8px;
        background: rgba(255,255,255,0.6);
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
    }
    .weather-item:hover {
        transform: translateX(-3px);
        background: rgba(255,255,255,0.9);
    }
    .weather-item:last-child { margin-bottom: 0; }

    .w-icon { width: 40px; text-align: center; font-size: 1.5rem; }
    .w-info { flex: 1; padding-left: 10px; }
    .w-loc { font-weight: 600; font-size: 0.95rem; color: #1f2937; }
    .w-desc { font-size: 0.8rem; color: #6b7280; }
    .w-temp { font-weight: 800; font-size: 1.2rem; color: #3b82f6; }

    /* Thẻ thời tiết LỚN (Khi hiển thị điểm đến) */
    .weather-item.big-card {
        flex-direction: column;
        text-align: center;
        padding: 20px;
        background: transparent;
    }
    .big-card:hover { transform: none; background: transparent; }
    .big-card .w-icon { width: 100%; font-size: 3.5rem; margin-bottom: 10px; }
    .big-card .w-info { padding: 0; width: 100%; }
    .big-card .w-loc { font-size: 1.2rem; margin-bottom: 5px; }
    .big-card .w-temp { font-size: 2.5rem; display: block; margin-top: 10px; }
    .big-card .w-desc { font-size: 1rem; }

    .spinner { display: none; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    #weather-widget {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        width: 280px; /* Rộng hơn chút để hiện đẹp */
        background: rgba(255, 255, 255, 0.65); /* Trong suốt hơn */
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        display: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        cursor: pointer; /* Con trỏ tay để biết click được */
        user-select: none; /* Không cho bôi đen text khi click nhanh */
    }

    #weather-widget:hover {
        background: rgba(255, 255, 255, 0.8);
        transform: translateY(-2px);
    }

    #weather-content {
        transition: opacity 0.3s ease-in-out; /* Hiệu ứng chuyển slide */
    }

    #weather-title {
        font-size: 0.85rem;
        font-weight: 700;
        color: #4b5563;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        border-bottom: 1px solid rgba(0,0,0,0.05);
        padding-bottom: 10px;
    }

    /* Layout của Slide */
    .weather-slide {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .slide-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 10px;
    }

    .w-icon-large {
        font-size: 3rem;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .w-temp-large {
        font-size: 3rem;
        font-weight: 800;
        line-height: 1;
        color: #3b82f6;
    }

    .slide-body {
        width: 100%;
    }

    .w-loc-large {
        font-size: 1.4rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 4px;
    }

    .w-desc {
        font-size: 1rem;
        color: #6b7280;
        text-transform: capitalize;
    }

    .slide-hint {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-top: 5px;
        font-style: italic;
    }

    /* Nút "Xem trên bản đồ" riêng biệt */
    .btn-fly-map {
        margin-top: 15px;
        background: rgba(59, 130, 246, 0.1);
        color: #2563eb;
        border: 1px solid rgba(59, 130, 246, 0.2);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
    }

    .btn-fly-map:hover {
        background: #2563eb;
        color: white;
    }
</style>

<div class="container-fluid mt-4 mb-4">
    <div id="map-wrapper" data-lang="vi">
        <div id="map"></div>

        <div class="search-panel">
            <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom:15px; color:#1f2937;">
                <i class="fas fa-route text-primary"></i> Lộ trình
            </h3>
            <div class="input-group">
                <i class="fas fa-map-marker-alt text-danger"></i>
                <input type="text" id="start-point" class="search-input" placeholder="Điểm đi (VD: Hà Nội)">
            </div>
            <div class="input-group">
                <i class="fas fa-flag-checkered text-success"></i>
                <input type="text" id="end-point" class="search-input" placeholder="Điểm đến (VD: Đà Nẵng)">
            </div>

            <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
                <button id="btn-swap-points" type="button" class="btn-primary-custom" style="width:48%;background:linear-gradient(90deg,#10b981,#059669);padding:8px;font-size:0.95rem;">
                    <i class="fas fa-exchange-alt"></i>&nbsp;Đổi chỗ
                </button>
                <button id="btn-my-location" type="button" class="btn-primary-custom" style="width:48%;background:linear-gradient(90deg,#f59e0b,#d97706);padding:8px;font-size:0.95rem;">
                    <i class="fas fa-location-arrow"></i>&nbsp;Vị trí của tôi
                </button>
            </div>
            <button id="btn-find-route" class="btn-primary-custom">
                <span id="route-spinner" class="spinner"></span>
                <span>Tìm đường & Xem thời tiết</span>
            </button>
        </div>

        <div id="weather-widget">
            <div id="weather-title">Điểm đến phổ biến</div>
            <div id="weather-content">
                </div>
        </div>
    </div>
</div>

<script src="{% static 'home/js/map_view.js' %}"></script>
{% endblock %}
