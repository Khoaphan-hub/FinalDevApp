<!doctype html>
<html lang="vi">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html,body,#map{height:100%;margin:0;background:#eef3f0;font-family:system-ui,sans-serif}
    #status{position:absolute;z-index:999;top:12px;left:50%;transform:translateX(-50%);background:white;padding:9px 14px;border-radius:18px;box-shadow:0 4px 18px #0002;color:#1f5d50;font-size:13px;white-space:nowrap}
    .number{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#1f5d50;color:white;font-weight:700;border:3px solid white;box-shadow:0 2px 8px #0004}
  </style>
</head>
<body><div id="map"></div><div id="status">Đang tải tuyến đường…</div>
<script>
const map=L.map('map',{zoomControl:true}).setView([11.9404,108.4583],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
async function renderRoute(stops){
  const valid=stops.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lon));
  if(!valid.length){document.getElementById('status').textContent='Không có tọa độ để hiển thị';return;}
  const bounds=[];
  valid.forEach((s,i)=>{
    const icon=L.divIcon({className:'',html:`<div class="number">${i+1}</div>`,iconSize:[34,34],iconAnchor:[17,17]});
    L.marker([s.lat,s.lon],{icon}).addTo(map).bindPopup(`<b>${i+1}. ${s.name}</b><br>${s.type}`);
    bounds.push([s.lat,s.lon]);
  });
  map.fitBounds(bounds,{padding:[28,28]});
  const coordinates=valid.map(s=>`${s.lon},${s.lat}`).join(';');
  try{
    const response=await fetch(`https://router.project-osrm.org/route/v1/driving/${coordinates}?overview=full&geometries=geojson`);
    const json=await response.json();
    if(!json.routes||!json.routes.length) throw new Error('no route');
    const line=L.geoJSON(json.routes[0].geometry,{style:{color:'#f28c68',weight:6,opacity:.9}}).addTo(map);
    map.fitBounds(line.getBounds(),{padding:[28,28]});
    document.getElementById('status').textContent=`${(json.routes[0].distance/1000).toFixed(1)} km • ${Math.round(json.routes[0].duration/60)} phút`;
  }catch(error){
    L.polyline(bounds,{color:'#f28c68',weight:5,dashArray:'8 8'}).addTo(map);
    document.getElementById('status').textContent='Đang hiển thị đường nối dự phòng';
  }
}
</script></body></html>
